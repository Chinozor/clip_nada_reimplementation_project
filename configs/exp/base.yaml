seed: 42

paths:
  stylegan2_repo: "third_party/stylegan2-pytorch"
  weights_dir: "weights"
  outputs_root: "outputs"

prompts:
  src: "configs/prompts/src_face.yaml"
  tgt: "configs/prompts/tgt_anime_face.yaml"
  global: "configs/prompts/tgt_anime_face.yaml"

train:
  steps: 1000
  batch_size: 32
  z_dim: 512
  reselection_every: 1
  top_k: 12
  unfreeze_layers_policy: "weight_only"   # weight_only | full
  use_layer_selection: true

logging:
  preview_every: 100
  ckpt_every: 300

